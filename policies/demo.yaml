# Policy for the demo MCP server (warden.demo_server).
#
# The tainted-escalation rules are scoped to EXTERNAL_COMMS and DESTRUCTIVE only, on
# threat-model grounds: see docs/adr/0002-tainted-write-scoping.md. Internal,
# reversible writes proceed. This is NOT a response to false-positive rates.
schema_version: 1

fail_modes:
  LOW: OPEN
  MEDIUM: CLOSED
  HIGH: CLOSED
  CRITICAL: CLOSED

# Transcribed by hand from what the server declares. The server is not trusted to
# classify itself -- see docs/adr/0001-retrieval-declaration-trust-boundary.md.
classification:
  search_docs:     { risk_level: LOW,      side_effect: READ_ONLY }
  get_customer:    { risk_level: MEDIUM,   side_effect: READ_ONLY }
  create_ticket:   { risk_level: MEDIUM,   side_effect: LOCAL_WRITE }
  send_email:      { risk_level: HIGH,     side_effect: EXTERNAL_COMMS }
  delete_customer: { risk_level: CRITICAL, side_effect: DESTRUCTIVE }

# Operator's declaration, never the server's. A server that could declare itself
# non-retrieval could shed taint.
retrieval_tools:
  - search_docs

# Per-run call cap: a blunt damage-capping control, not a detector. Once a run makes
# this many tool calls, every further call is denied regardless of what it is. Sized
# above the longest benign task here (get_customer -> search_docs -> create_ticket ->
# send_email = 4) with headroom, so it never trips a legitimate run.
budgets:
  max_calls_per_run: 8

# First match wins, in file order. The four high-consequence rules form a complete
# case analysis over the taint dimension, so none needs a lint exemption.
rules:
  - id: exfil-via-external-comms
    description: >
      Untrusted provenance reaching a tool that talks outside the trust boundary.
      The primary exfiltration path the red-team suite exercises.
    match:
      side_effect: [EXTERNAL_COMMS]
      argument_taint:
        any_of:
          - kind: RETRIEVED
          - kind: TOOL_OUTPUT
    outcome: DENY

  - id: comms-untainted-requires-approval
    description: >
      Outbound communication derived only from operator input. USER_INPUT is
      semi-trusted, not trusted -- direct prompt injection arrives through it -- so
      crossing the trust boundary still needs a human.
    match:
      side_effect: [EXTERNAL_COMMS]
      argument_taint:
        none_of:
          - kind: RETRIEVED
          - kind: TOOL_OUTPUT
    outcome: REQUIRE_APPROVAL

  - id: tainted-destructive
    description: >
      Untrusted provenance reaching an irreversible operation. Escalated to a human
      rather than denied outright: a destructive action is frequently one the operator
      legitimately requested, and at turn level a user-authorised deletion that the
      agent verified first is indistinguishable from an injection that induced the same
      deletion (see docs/findings/benign-erasure-deviation.md and
      docs/adr/0004-destructive-escalates-not-denies.md). The human is the intent-judge
      the system cannot be; in a benchmark the approval auto-denies, so the attack is
      still stopped. Exfiltration stays DENY -- disclosure is not recoverable and not a
      confirm-and-proceed action.
    match:
      side_effect: [DESTRUCTIVE]
      argument_taint:
        any_of:
          - kind: RETRIEVED
          - kind: TOOL_OUTPUT
    outcome: REQUIRE_APPROVAL

  - id: destructive-untainted-requires-approval
    description: Irreversible operations always need a human, tainted or not.
    match:
      side_effect: [DESTRUCTIVE]
      argument_taint:
        none_of:
          - kind: RETRIEVED
          - kind: TOOL_OUTPUT
    outcome: REQUIRE_APPROVAL

  - id: internal-write-allow
    description: >
      Internal, reversible writes that exfiltrate nothing. Scoped per the threat
      model: a rule broader than its threat model is a rule that gets disabled.
    match:
      side_effect: [LOCAL_WRITE]
    outcome: ALLOW

  - id: read-only-allow
    description: Read-only tools carry no side effect worth gating.
    match:
      side_effect: [READ_ONLY]
    outcome: ALLOW
